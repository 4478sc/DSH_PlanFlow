name: CI

# Lean replacement for the inherited upstream pipelines: install, run the
# main-process tests, run the unit suites. Publishing, store uploads and the
# scheduled provider E2E suites were removed on purpose (see INDEPENDENCE.md);
# re-add what you need with your own secrets.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript and templates
        run: npm run lint:ts

      - name: Stylesheets
        run: npm run lint:scss

      - name: CSS variables
        run: npm run lint:css-vars

      - name: Local lint rules
        run: npm run test:lint-rules

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Main-process tests
        run: npm run test:electron

      - name: Unit tests
        run: npm test
